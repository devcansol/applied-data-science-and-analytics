[project]
name = "startup-outcomes"
version = "0.1.0"
description = "Leakage-controlled analysis of a synthetic global tech/AI startup outcomes dataset"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    # >=1.6 is a correctness floor, not a preference: HistGradientBoostingClassifier's
    # categorical_features="from_dtype" was added in 1.4 and only became the default in
    # 1.6. The <2 cap makes a major bump a reviewed act rather than a `uv lock --upgrade`
    # side effect — within 1.x, tests/test_supervised.py is the notification channel.
    "scikit-learn>=1.6,<2",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "jupyter>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/startup_outcomes"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Ruff formats fenced Python blocks inside Markdown. The harness rule files carry
# illustrative snippets — including deliberately-wrong "BAD" examples — which must not
# be rewritten to satisfy the formatter.
#
# `references/` is unmodified third-party course material that this project mirrors but
# never imports. Reformatting it would destroy the fidelity of the source the four tiers
# are checked against — the same argument as `.claude` above — and its 306 findings hide
# the ones that matter. This is a path exclusion with a written rationale, not a widened
# `ignore`; see .claude/rules/process-lint-check.md.
extend-exclude = [".claude", "references"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PD"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --durations=5 keeps the runtime budget visible on every run: the suite fits a ~45s
# target and a regression should be obvious the moment it lands, not months later.
addopts = "-q --durations=5"
# mlkit.py suppresses warnings wholesale; this project does the opposite. A FutureWarning
# is a scheduled breakage, so it fails the build while there is still time to act.
filterwarnings = ["error::FutureWarning"]
